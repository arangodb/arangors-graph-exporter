[package]
name = "arangors-graph-exporter"
version = "0.1.1"
edition = "2024"

description = "Provides lightning-fast graph data access to ArangoDB"
license = "MIT"
repository = "https://github.com/arangodb/arangors-graph-exporter"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0.203", features = ["derive"] }
tokio = { version = "1.36.0", features = ["rt-multi-thread"] }
log = "0.4.22"
bytes = { version = "1.4.0", default-features = false }
reqwest = { version = "0.12.24", features = ["rustls-tls", "json"], default-features = false }
reqwest-middleware = "0.4.2"
reqwest-retry = "0.8.0"
thiserror = "2.0.17"

[dev-dependencies]
serial_test = "3.2.0"
tokio = { version = "1.38.0", features = ["full"] }
rstest = "0.26.1"
